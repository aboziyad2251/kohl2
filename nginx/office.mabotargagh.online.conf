# Nginx HTTP-only Configuration for Real Estate Office Management System
# Subdomain: office.mabotargagh.online

server {
    listen 80;
    listen [::]:80;
    server_name office.mabotargagh.online;

    access_log /var/log/nginx/office_mabotargagh_access.log;
    error_log  /var/log/nginx/office_mabotargagh_error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ACME Webroot challenge location for Certbot SSL
    location /.well-known/acme-challenge/ {
        root /var/www/office_mabotargagh;
    }

    # Proxy PostgREST API requests
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:8020/rest/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to Next.js Docker Container running on Port 3005
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
