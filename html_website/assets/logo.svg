<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(320, 15)">
    <!-- Outer Hexagon / Shield -->
    <path d="M35 5 L65 22 L65 58 L35 75 L5 58 L5 22 Z" fill="rgba(15, 23, 42, 0.8)" stroke="url(#primaryGlow)" stroke-width="2.5" filter="url(#shadow)"/>
    <!-- Modern Real Estate Towers -->
    <path d="M22 60 L22 35 L34 25 L34 60 Z" fill="url(#primaryGlow)" />
    <path d="M36 60 L36 20 L48 30 L48 60 Z" fill="url(#goldGlow)" />
    <!-- Center Dot / Key -->
    <circle cx="35" cy="12" r="3" fill="#38bdf8" />
  </g>

  <!-- Typography (Arabic & English) -->
  <g fill="#ffffff" font-family="'Tajawal', 'IBM Plex Sans Arabic', sans-serif">
    <!-- Arabic Main Title -->
    <text x="300" y="45" text-anchor="end" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      المكتب العقاري الموحد
    </text>
    <!-- Arabic Subtitle -->
    <text x="300" y="68" text-anchor="end" font-size="12" font-weight="600" fill="#38bdf8">
      منظومة إدارة الأملاك والعقود الذكية
    </text>
  </g>
</svg>
