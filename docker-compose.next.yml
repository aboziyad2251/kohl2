services:
  kohl_crm_app:
    build:
      context: .
      dockerfile: Dockerfile.next
    container_name: kohl_crm_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - INTERNAL_SEARCH_API_KEY=${INTERNAL_SEARCH_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - default
      - supabase_default
      - n8n_net

networks:
  default:
  supabase_default:
    external: true
  n8n_net:
    external: true
