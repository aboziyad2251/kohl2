services:
  kohl_crm_app:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: kohl_crm_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - INTERNAL_SEARCH_API_KEY=${INTERNAL_SEARCH_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SUPABASE_SERVER_URL=${SUPABASE_SERVER_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - APP_ORIGIN=${APP_ORIGIN:-https://app.kohlestate-ksa.online}
      - GOOGLE_LOGIN_ENABLED=${GOOGLE_LOGIN_ENABLED:-false}
      - PASSWORD_RECOVERY_ENABLED=${PASSWORD_RECOVERY_ENABLED:-false}
    networks:
      - default
      - supabase_default
      - n8n_net

networks:
  default:
  supabase_default:
    external: true
  n8n_net:
    external: true
